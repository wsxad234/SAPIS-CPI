name: CPI Lint Check

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  cpilint:
    name: CPILint Inspection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed IFLOWs
        id: changes
        run: |
          # Determine the diff base
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            BASE="HEAD~1"
          else
            BASE="4b825dc642cb6eb9a060e54bf899d9a2309f5f7c"  # git empty tree
          fi

          echo "Diff base: $BASE"
          CHANGED_FILES=$(git diff --name-only "$BASE" HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Map changed files to their containing IFLOW dirs (directories with META-INF/MANIFEST.MF)
          IFLOW_DIRS=""
          for f in $CHANGED_FILES; do
            DIR=$(dirname "$f")
            while [ "$DIR" != "." ] && [ "$DIR" != "/" ]; do
              if [ -f "$DIR/META-INF/MANIFEST.MF" ]; then
                IFLOW_DIRS="$IFLOW_DIRS $DIR"
                break
              fi
              DIR=$(dirname "$DIR")
            done
          done

          IFLOW_DIRS=$(echo "$IFLOW_DIRS" | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "Changed IFLOW directories: $IFLOW_DIRS"
          echo "dirs=$IFLOW_DIRS" >> $GITHUB_OUTPUT

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download and install CPILint
        run: |
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/mwittrock/cpilint/releases/latest \
            | grep "browser_download_url.*cpilint.*\.zip" \
            | cut -d '"' -f 4)
          echo "Downloading CPILint from: $DOWNLOAD_URL"
          curl -sSL -o cpilint.zip "$DOWNLOAD_URL"
          unzip -q cpilint.zip -d cpilint-install
          # ZIP contains a versioned top-level dir; find the actual bin path
          BIN_DIR=$(find cpilint-install -type f -name cpilint | head -1 | xargs dirname)
          echo "Found CPILint binary at: $BIN_DIR"
          chmod +x "$BIN_DIR/cpilint"
          echo "$BIN_DIR" >> $GITHUB_PATH

      - name: Run CPILint
        id: lint
        continue-on-error: true
        run: |
          IFLOW_DIRS="${{ steps.changes.outputs.dirs }}"

          if [ -z "$(echo $IFLOW_DIRS | tr -d ' ')" ]; then
            echo "No IFLOW directories changed in this commit. Skipping lint."
            echo "SKIPPED" > cpilint-output.txt
            echo "EXIT_CODE=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Inspecting changed IFLOWs: $IFLOW_DIRS"
          cpilint -rules cpilint-rules.xml -unpacked-files $IFLOW_DIRS -boring -skipvercheck 2>&1 | tee cpilint-output.txt
          echo "EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const exitCode = '${{ steps.lint.outputs.EXIT_CODE }}';
            const passed = exitCode === '0';

            let output = '';
            try {
              output = fs.readFileSync('cpilint-output.txt', 'utf8').trim();
            } catch (e) {
              output = '(No output captured)';
            }

            const isSkipped = output.includes('SKIPPED');
            const shortSha = '${{ github.sha }}'.substring(0, 7);
            const statusIcon = isSkipped ? '⏭️' : (passed ? '✅' : '❌');
            const changedDirs = '${{ steps.changes.outputs.dirs }}'.trim();

            let statusText;
            if (isSkipped) {
              statusText = 'No IFLOW files changed in this commit. Check skipped.';
            } else if (passed) {
              statusText = 'All checks passed, no issues found.';
            } else {
              statusText = 'Issues found. Please fix the problems below before merging.';
            }

            let body = `## ${statusIcon} CPI Lint Check Result\n\n`;
            body += `**Commit:** \`${shortSha}\`\n`;
            if (changedDirs) {
              body += `**Changed IFLOWs:** ${changedDirs}\n`;
            }
            body += `**Status:** ${statusText}\n`;

            if (!isSkipped) {
              body += `\n\`\`\`\n${output || '(empty)'}\n\`\`\``;
            }

            body += `\n\n> [View workflow run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Post commit comment
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const exitCode = '${{ steps.lint.outputs.EXIT_CODE }}';
            const passed = exitCode === '0';

            let output = '';
            try {
              output = fs.readFileSync('cpilint-output.txt', 'utf8').trim();
            } catch (e) {
              output = '(No output captured)';
            }

            const isSkipped = output.includes('SKIPPED');
            const shortSha = '${{ github.sha }}'.substring(0, 7);
            const statusIcon = isSkipped ? '⏭️' : (passed ? '✅' : '❌');
            const changedDirs = '${{ steps.changes.outputs.dirs }}'.trim();

            let statusText;
            if (isSkipped) {
              statusText = 'No IFLOW files changed in this commit. Check skipped.';
            } else if (passed) {
              statusText = 'All checks passed, no issues found.';
            } else {
              statusText = 'Issues found. Please fix the problems below.';
            }

            let body = `## ${statusIcon} CPI Lint Check Result\n\n`;
            body += `**Commit:** \`${shortSha}\`\n`;
            if (changedDirs) {
              body += `**Changed IFLOWs:** ${changedDirs}\n`;
            }
            body += `**Status:** ${statusText}\n`;

            if (!isSkipped) {
              body += `\n\`\`\`\n${output || '(empty)'}\n\`\`\``;
            }

            body += `\n\n> [View workflow run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`;

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });

      - name: Fail if issues found
        if: steps.lint.outputs.EXIT_CODE != '0'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::error::CPILint found issues. See PR comment for details."
          else
            echo "::error::CPILint found issues. Check the workflow run log above for details."
          fi
          exit 1
